<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Todo Tab</title>
<script>
  try {
    document.documentElement.dataset.theme =
      localStorage.getItem("todoTabTheme") === "light" ? "light" : "dark";
  } catch (e) {}
</script>
<link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>

  <header class="top">
    <div class="clock">
      <span class="clock-time" id="clock-time"></span>
      <span class="clock-date" id="clock-date"></span>
    </div>

    <div class="focus" id="focus" data-state="idle">
      <div class="focus-ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="focus-track" cx="50" cy="50" r="44" />
          <circle class="focus-progress" id="focus-progress" cx="50" cy="50" r="44" />
        </svg>
        <div class="focus-center">
          <input type="number" id="focus-minutes" class="focus-minutes" min="1" max="180" step="1" aria-label="Focus minutes" />
          <span class="focus-readout" id="focus-readout"></span>
          <span class="focus-unit" id="focus-unit"></span>
        </div>
      </div>
      <div class="focus-actions">
        <button type="button" class="focus-btn" id="focus-primary">Start</button>
        <button type="button" class="focus-btn focus-btn--quiet" id="focus-reset">Reset</button>
      </div>    </div>
  </header>

  <main class="board">
    <section class="column" data-list="today">
      <div class="column-head">
        <h2>Today</h2>
        <button type="button" class="add-btn" data-list="today" aria-label="Add task">+</button>
      </div>
      <ul class="task-list" data-list="today"></ul>
    </section>

    <section class="column" data-list="later">
      <div class="column-head">
        <h2>Later</h2>
        <button type="button" class="add-btn" data-list="later" aria-label="Add task">+</button>
      </div>
      <ul class="task-list" data-list="later"></ul>
    </section>

    <section class="column column--deadlines" data-list="deadlines">
      <ul class="task-list deadline-list" data-list="deadlines"></ul>
      <button type="button" class="add-btn add-deadline-btn" data-list="deadlines" aria-label="Add deadline">+ Add deadline</button>
    </section>
  </main>

  <template id="task-template">
    <li class="task" draggable="true">
      <input type="checkbox" class="task-done" />
      <span class="task-text"></span>
      <span class="task-due-label"></span>
      <span class="task-due-wrap">
        <span class="task-due-display"></span>
        <input type="date" class="task-due-input" aria-label="Due date" />
      </span>
      <button type="button" class="task-delete" aria-label="Delete task">&times;</button>
    </li>
  </template>

  <template id="deadline-template">
    <li class="task deadline-card" draggable="true">
      <div class="deadline-main">
        <span class="task-text"></span>
        <button type="button" class="task-delete" aria-label="Delete task">&times;</button>
      </div>
      <span class="deadline-window-wrap">
        <span class="deadline-window">
          <span class="deadline-days"></span>
        </span>
        <span class="deadline-caption"></span>
        <input type="date" class="task-due-input" aria-label="Due date" />
      </span>
    </li>
  </template>

  <script src="newtab.js"></script>
</body>
</html>
